name: Instrumentation Tests

# 手动触发的 UI 测试，避免模拟器环境不稳定时污染主构建状态
# 在 GitHub Actions 页面点击 "Run workflow" 即可运行
on:
  workflow_dispatch:
  # 也保留 push 自动触发，但作为独立 workflow 运行，不影响主构建

jobs:
  instrumentation:
    name: Instrumentation tests (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6a
          script: ./gradlew connectedDebugAndroidTest --no-parallel --max-workers=2 --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: |
            **/build/reports/androidTests
            **/build/outputs/androidTest-results
